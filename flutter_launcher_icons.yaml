# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/Bazar_App_Icon.jpg"

  android: "launcher_icon"
  image_path_android: "assets/icon/Bazar_App_Icon.jpg"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#54408C"
  adaptive_icon_foreground: assets/icon/Bazar_App_Icon.jpg

  ios: true
  image_path_ios: "assets/icon/Bazar_App_Icon.jpg"
  remove_alpha_ios: true
  background_color_ios: "#54408C"
